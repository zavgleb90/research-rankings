<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>University Map</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>
<body>

<header>
  <div class="logo">📚 Research Rankings</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="universities.html">Universities</a>
    <a href="authors.html">Authors</a>
    <a href="journals.html">Journals</a>
    <a href="articles.html">Articles</a>
    <a href="map.html" class="active">Map</a>
    <a href="methodology.html">Methodology</a>
  </nav>
</header>

<div class="container">

  <!-- FILTER PANEL -->
  <aside class="filter-panel">
    <h3>Filter</h3>

    <div class="filter-group">
      <label for="startYear">Start Year</label>
      <select id="startYear"></select>
    </div>

    <div class="filter-group">
      <label for="endYear">End Year</label>
      <select id="endYear"></select>
    </div>

    <div class="filter-group">
      <label for="topNSlider">Top N (10–200)</label>
      <input id="topNSlider" type="range" min="10" max="200" step="1" value="100">
      <div id="topNValue" style="margin-top:6px;">Top N: 100</div>
    </div>

    <div class="filter-group">
      <label>Filter by Discipline</label>
      <select id="disciplineFilter">
        <option value="ALL">All Disciplines</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Filter by Journal Group</label>
      <select id="groupFilter">
        <option value="ALL">All Journals</option>
        <option value="UTD24">UTD 24 Journals</option>
        <option value="FT50">FT 50 Journals</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Filter by Journal</label>
      <div id="journalCheckboxes" class="checkbox-list"></div>
    </div>

    <button id="resetFiltersBtn" class="reset-btn">Reset Filters</button>
  </aside>

  <!-- MAIN CONTENT -->
  <section class="main-content">
    <h1>University Map</h1>
    <p>
      Marker size scales linearly with the number of articles for the selected filters.
      Click a marker to see details.
    </p>

    <div id="map" class="map-canvas"></div>

    <div id="missingGeoNote" style="margin-top:14px; font-size: 14px;"></div>
  </section>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Your map logic -->
<script src="map.js"></script>
</body>
</html>
